<!DOCTYPE html>
<html lang="en"
      xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>

        <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico"/>

        <!-- CSS here -->
        <link rel="stylesheet" href="assets/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="assets/css/owl.carousel.min.css"/>
        <link rel="stylesheet" href="assets/css/slicknav.css"/>
        <link rel="stylesheet" href="assets/css/flaticon.css"/>
        <link rel="stylesheet" href="assets/css/progressbar_barfiller.css"/>
        <!-- Remove this line (Gijgo) to avoid conflict -->
        <link rel="stylesheet" href="assets/css/animate.min.css"/>
        <link rel="stylesheet" href="assets/css/animated-headline.css"/>
        <link rel="stylesheet" href="assets/css/magnific-popup.css"/>
        <link rel="stylesheet" href="assets/css/fontawesome-all.min.css"/>
        <link rel="stylesheet" href="assets/css/themify-icons.css"/>
        <link rel="stylesheet" href="assets/css/slick.css"/>
        <link rel="stylesheet" href="assets/css/nice-select.css"/>
        <link rel="stylesheet" href="assets/css/style.css"/>

        <h:outputStylesheet name="primefaces.css" library="primefaces" />
        <!-- PrimeFaces JS after jQuery and jQuery UI -->
        <h:outputScript name="primefaces.js" library="primefaces" />

    </h:head>
    <h:body>
        <header>
            <!-- Header Start -->
            <div class="header-area">
                <div class="main-header header-sticky">
                    <!-- Logo -->
                    <div class="header-left">
                        <div class="logo">
                            <a href="index.html"><img src="assets/img/logo/logo.png" alt="" /></a>
                        </div>
                        <div class="menu-wrapper  d-flex align-items-center">
                            <!-- Main-menu -->
                            <div class="main-menu d-none d-lg-block">
                                <nav>
                                    <ul id="navigation">
                                        <li class="active"><a href="home.jsf">Home</a></li>
                                        <li><a href="about_us.jsf">About</a></li>
                                        <li><a href="services.jsf">Services</a></li>

                                        <li><a href="contact.jsf">Contact</a></li>
                                        <li>
                                        <h:form>
                                            <!-- Render Login link if the user is not logged in -->
                                            <h:panelGroup rendered="#{!loginMB.loggedIn}">
                                                <a href="login.jsf" class="dropdown-item">Login</a>
                                            </h:panelGroup>

                                            <!-- Render Log Out button if the user is logged in -->
                                            <h:panelGroup rendered="#{loginMB.loggedIn}">
                                                <h:commandLink value="Log Out" action="#{loginMB.logout()}" class="dropdown-item" />
                                            </h:panelGroup>
                                        </h:form>
                                        </li>

                                    </ul>

                                </nav>
                            </div>
                        </div>
                    </div>
                    <div class="header-right d-none d-lg-block">
                        <a href="#" class="header-btn1"><img src="assets/img/icon/call.png" alt="" /> (08) 728 256 266</a>
                        <a href="#" class="header-btn2"><h:panelGroup rendered="#{!loginMB.loggedIn}">
                                Make an Appointment
                            </h:panelGroup>

                            <!-- Render Log Out button if the user is logged in -->
                            <h:panelGroup rendered="#{loginMB.loggedIn}">
                                Welcome "#{loginMB.c.customerName}"!
                            </h:panelGroup></a>
                    </div>
                    <!-- Mobile Menu -->
                    <div class="col-12">
                        <div class="mobile_menu d-block d-lg-none"></div>
                    </div>
                </div>
            </div>
            <!-- Header End -->
        </header>

        <main>
            <!--? slider Area Start-->
            <section class="slider-area hero-overly">
                <div class="slider-active">
                    <!-- Single Slider -->
                    <div class="single-slider slider-height d-flex align-items-center">
                        <div class="container">
                            <div class="row">
                                <div class="col-xl-7 col-lg-9 col-md-10 col-sm-9">
                                    <div class="hero__caption">
                                        <h1 data-animation="fadeInLeft" data-delay="0.2s">Quality laundry service in your
                                            city</h1>
                                        <p data-animation="fadeInLeft" data-delay="0.4s">We take care about cleenness of
                                            your cloth</p>
                                        <a href="#" class="btn hero-btn" data-animation="fadeInLeft"
                                           data-delay="0.7s">Explore Services</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- slider Area End-->
            <!--? Services Area Start -->
            <section class="order-form section-padding40 fix">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-6">
                            <div class="section-tittle text-center mb-55">
                                <h2>Add New Order</h2>
                            </div>
                            <h:form class="ui-form">
                                <div class="form-group">
                                    <label for="CustomerId">Customer ID</label>
                                    <h:inputText id="CustomerId" value="#{orderBean.customerId}" styleClass="form-control"  disabled="true" />
                                </div>
                                <div class="form-group">
                                    <label for="PickupDate">Pickup Date</label>
                                    <!-- Use PrimeFaces Calendar widget -->
                                    <p:calendar id="PickupDate" value="#{orderBean.pickup_date}" pattern="yyyy-MM-dd" showOn="button" />
                                </div>
                                <div class="form-group">
                                    <label for="DeliveryDate">Delivery Date</label>
                                    <!-- Use PrimeFaces Calendar widget -->
                                    <p:calendar id="DeliveryDate" value="#{orderBean.delivery_date}" pattern="yyyy-MM-dd" showOn="button"/>
                                </div>
                                <div class="form-group">
                                    <label for="Status">Status</label>
                                    <h:inputText id="Status" value="#{orderBean.status}" styleClass="form-control" disabled="true"/>
                                </div>
                                <div class="form-group">
                                    <h:commandButton type="submit" value="Add Order" action="#{orderBean.addorder()}" styleClass="btn btn-primary btn-block" />
                                </div>
                            </h:form>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer and JS -->
        <footer>
            <!-- Footer Start-->
            <div class="footer-area footer-padding">
                <div class="container">
                    <div class="row d-flex justify-content-between">
                        <!-- Footer content here -->
                    </div>
                </div>
            </div>
            <!-- footer-bottom area -->
        </footer>

        <!-- Scroll Up -->
        <div id="back-top">
            <a title="Go to Top" href="#"> <i class="fas fa-level-up-alt"></i></a>
        </div>

        <!-- JS here -->
        <script src="assets/js/vendor/modernizr-3.5.0.min.js"></script>
        <!-- Jquery, Popper, Bootstrap -->
        <script src="assets/js/vendor/jquery-3.6.0.min.js"></script>
        <script src="assets/js/popper.min.js"></script>
        <script src="assets/js/bootstrap.min.js"></script>

        <!-- Jquery UI (for PrimeFaces calendar) -->
        <script src="https://code.jquery.com/ui/1.12.4/jquery-ui.min.js"></script>

        <!-- PrimeFaces JS -->
        <script src="assets/js/primefaces.js"></script>

        <!-- Additional JS -->
        <script src="assets/js/plugins.js"></script>
        <script src="assets/js/main.js"></script>

    </h:body>
</html>
