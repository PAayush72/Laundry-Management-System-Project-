<!DOCTYPE html>
<html lang="en" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Login</title>
        <h:outputLink value="resource/css/style.css" target="_blank"/>
        
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
        <!-- Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
              integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
              crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- Custom CSS -->
        <link rel="stylesheet" href="resource/css/style.css"/>
        
    </h:head>
    
    <h:body class="bg-light">
        <h:form>
            <!-- Centering the form using Flexbox -->
            <div class="container d-flex justify-content-center align-items-center min-vh-100">
                <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 15px;">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Login</h2>
                    </div>
                    
                    <!-- Username input -->
                    <div class="mb-3">
                        <h:outputLabel for="username" value="Username" class="form-label"/>
                        <h:inputText id="username" value="#{loginMB.email}" class="form-control" />
                    </div>
                    
                    <!-- Password input -->
                    <div class="mb-3">
                        <h:outputLabel for="password" value="Password" class="form-label"/>
                        <h:inputSecret id="password" value="#{loginMB.password}" class="form-control" />
                        <div class="d-flex justify-content-end">
                            <a href="#" class="text-muted small">Forgot Password?</a>
                        </div>
                    </div>
                    
                    <!-- Sign In Button -->
                    <h:commandButton value="Sign In" action="#{loginMB.login}" class="btn btn-primary w-100 mt-3 py-2"/>

                    <!-- Sign Up link -->
                    <div class="mt-3 text-center">
                        <p class="small">Don't have an account? <a href="register.jsf" class="fw-bold text-decoration-none">Sign up</a></p>
                    </div>
                </div>
            </div>
        </h:form>
    </h:body>
</html>
