<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login/Signup Form</title>

        <!-- Boxicons for icons -->
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' />
        
        <style>
            body {
                background: #ffffff; /* White background */
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: Arial, sans-serif;
            }

            h1 {
                color: #333;
                text-transform: uppercase;
                letter-spacing: 2px;
                margin-bottom: 40px;
            }

            .form-container {
                background: #fff;
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                width: 100%;
                max-width: 450px;
                text-align: center;
                border: 1px solid #ddd;
            }

            .form-container label {
                display: block;
                font-size: 14px;
                margin-bottom: 8px;
                text-align: left;
                color: #333;
            }

            .form-container input {
                width: 100%;
                padding: 14px;
                margin-bottom: 15px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                transition: all 0.3s ease;
                background: transparent;
                color: #333;
            }

            .form-container input:focus {
                border-color: #1aaf75;
                box-shadow: 0 0 10px rgba(26, 175, 117, 0.3);
            }

            .form-container input::placeholder {
                color: #bbb;
            }

            .form-container input[type="submit"] {
                background-color: #1aaf75;
                color: #fff;
                border: none;
                cursor: pointer;
                transition: background-color 0.3s ease;
                font-size: 18px;
                padding: 15px;
            }

            .form-container input[type="submit"]:hover {
                background-color: #109f67;
            }

            .form-container .forgot-password {
                text-align: left;
                font-size: 12px;
                color: #666;
            }

            .form-container .forgot-password a {
                color: #1aaf75;
                text-decoration: none;
            }

            .form-container .forgot-password a:hover {
                text-decoration: underline;
            }

            .form-container .signup {
                font-size: 14px;
                margin-top: 20px;
            }

            .form-container .signup a {
                color: #3857af;
                text-decoration: none;
            }

            .form-container .signup a:hover {
                text-decoration: underline;
            }

        </style>
    </h:head>
    <h:body>
        <div class="form-container">
            <h1>Signup</h1>
            <h:form>
                <!-- Name Input -->
                <h:outputLabel value="Name" />
                <h:inputText value="#{signup.customerName}" required="true" />
                
                <!-- Address Input -->
                <h:outputLabel value="Address" />
                <h:inputText value="#{signup.customerAddress}" required="true"  />
                
                <!-- Email Input -->
                <h:outputLabel value="Email" />
                <h:inputText value="#{signup.email}" required="true"  />
                
                <!-- Phone Number Input -->
                <h:outputLabel value="Phone Number" />
                <h:inputText value="#{signup.phno}" required="true"  />

                <!-- Password Input -->
                <h:outputLabel value="Password" />
                <h:inputSecret value="#{signup.password}" required="true" />
                
                <!-- Submit Button -->
                <h:commandButton value="Sign Up" action="#{signup.addcust}" type="submit" />

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <div class="signup">
                    <p>Already have an account? <a href="login.jsf">Login here</a></p>
                </div>
            </h:form>
        </div>
    </h:body>
</html>
